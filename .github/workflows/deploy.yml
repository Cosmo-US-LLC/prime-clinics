name: Deploy to Vercel

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: npx vercel deploy --token ${{ secrets.VERCEL_TOKEN_2 }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.PRIME_VERCEL_ORG_ID_2 }}
          VERCEL_PROJECT_ID: ${{ secrets.PRIME_VERCEL_PROJECT_ID_2 }}
